# MineASM global build configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Gradle runtime JVM on this machine (Gradle 8.14 supports Java 8~24; JDK 25 is not
# yet supported by 8.x). If the machine default is Java >= 25, point
# org.gradle.java.home to a JDK 8~24 installation, or switch to a Gradle
# distribution that supports it.
org.gradle.java.home=C:\\Program Files\\BellSoft\\LibericaJDK-8-Full

# ---- Native toolchain configuration (leave empty to probe PATH; missing tools
# ---- gracefully skip the corresponding native compile tasks) ----
# x86_64 assembler (NASM)
mineasm.native.x86_64.assembler=C:\\Program Files\\NASM\\nasm.exe
# x86_64 linker
mineasm.native.x86_64.linker=C:\\Program Files\\mingw64\\bin\\x86_64-w64-mingw32-gcc.exe
# arm32 assembler (GAS, usually driven by arm-linux-gnueabihf-gcc)
mineasm.native.arm32.assembler=
mineasm.native.arm32.linker=
# arm64 assembler (GAS, usually driven by aarch64-linux-gnu-gcc)
mineasm.native.arm64.assembler=
mineasm.native.arm64.linker=

# true = fail the build when a toolchain is missing; false (default) = skip the
# native target and log a warning
mineasm.native.strict=false
